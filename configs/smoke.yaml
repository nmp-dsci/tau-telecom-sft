# M2: the Mac proof of concept (plan §11). The same train/sft.py as the EC2 job, for a few
# steps on Qwen3-0.6B. Its scores are not results.
label: smoke-0.6b
purpose: smoke
base_model: Qwen/Qwen3-0.6B
# Step 1's student's tokenizer and chat template: the same vocabulary as the 0.6B, so the Mac
# trains, masks and serves exactly the text format M4's Qwen3-4B-Instruct-2507 will.
tokenizer: Qwen/Qwen3-4B-Instruct-2507
dataset: v1
rows:
  # rows that fit whole at 12K tokens (the system prompt and tools alone take 7,134). 16 of
  # them: one measured step of 2 rows took 272 s on the M1 Pro (73 tokens/s), so 16 steps of one
  # row each is about 36 minutes.
  max_tokens: 12288
  limit: 16
  seed: 300
# PyTorch's SDPA on the Mac's GPU builds the whole attention table (23 GB at 10K tokens);
# train/attention.py runs it in 1,024-query blocks. The GPU configs keep CUDA's own sdpa.
model_init:
  attn_implementation: chunked_sdpa
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
sft:
  max_length: 12288
  assistant_only_loss: true
  packing: false
  # the top of LoRA's usual 1e-4 to 2e-4 (plan §7), so 16 steps show the loss move
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  bf16: true
  logging_steps: 1
  save_strategy: "no"
  seed: 300
